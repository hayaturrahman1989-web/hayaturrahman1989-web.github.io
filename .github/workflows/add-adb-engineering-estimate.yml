name: Add ADB Engineering Estimate Experience

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add ADB experience to CV timeline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<div class="job"><span class="badge">CURRENT</span><h3>SITE MANAGER — Project Pembangunan Jaringan Distribusi Utama SPAM Maminasata</h3>'
          block = '<div class="job"><span class="badge">TENAGA AHLI</span><h3>TENAGA AHLI – ENGINEERING ESTIMATE — Asian Development Bank (ADB)</h3><p>Regional Water Supply Project (RWSP)</p><div class="date">⌖ Sumatera Utara, Indonesia &nbsp; | &nbsp; April 2026 – September 2026</div></div>'
          if 'TENAGA AHLI – ENGINEERING ESTIMATE — Asian Development Bank (ADB)' not in s:
              if marker not in s:
                  raise SystemExit('Target experience marker not found')
              s = s.replace(marker, block + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit website update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add ADB Engineering Estimate experience"
          git push
