name: Apply Project Reference Background

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !startsWith(github.event.head_commit.message, 'Apply project reference background') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble supplied hero pipeline image
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          parts = [
              Path('hero3.part01').read_bytes()[:12000],
              Path('hero3.part02').read_bytes()[:12000],
              Path('hero3.part03').read_bytes()[:12000],
              Path('hero3.part04').read_bytes()[:436],
          ]
          encoded = b''.join(parts)
          encoded = b''.join(encoded.split())
          image = base64.b64decode(encoded, validate=False)
          Path('hero-pipeline.webp').write_bytes(image)
          for p in Path('.').glob('hero3.part*'):
              p.unlink()
          for p in Path('.').glob('hero2.part*'):
              p.unlink()
          for p in Path('.').glob('hero-pipeline.part*'):
              p.unlink()
          PY

      - name: Set hero background
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          target = "url('hero-pipeline.webp') center/cover"
          s = s.replace("url('project-reference.jpg') center/cover", target, 1)
          s = s.replace("url('engineering-bg.svg') center/cover", target, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Remove temporary upload files
        run: |
          rm -f hero-pipeline-temp.txt hero-pipeline-temp2.txt hero-pipeline-temp3.txt hero-pipeline-temp4.txt hero-pipeline-temp5.txt

      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html hero-pipeline.webp hero-pipeline.b64 hero3.part* hero2.part* hero-pipeline.part* hero-pipeline-temp*.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Apply project reference background'
          git push
