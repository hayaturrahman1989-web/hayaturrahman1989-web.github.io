name: Apply Project Reference Background

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !startsWith(github.event.head_commit.message, 'Apply project reference background') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install supplied hero pipeline image
        run: |
          if [ "$(ls hero3.part{01..03} 2>/dev/null | wc -l)" -eq 3 ]; then
            cat hero3.part{01..03} | tr -cd 'A-Za-z0-9+/=' > hero-pipeline.b64
            base64 -d -i hero-pipeline.b64 > hero-pipeline.webp
            rm -f hero-pipeline.b64 hero3.part* hero2.part* hero-pipeline.part*
          fi

      - name: Set hero background
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          target = "url('hero-pipeline.webp') center/cover"
          fallback = "url('project-reference.jpg') center/cover"
          if Path('hero-pipeline.webp').exists():
              s = s.replace("url('project-reference.jpg') center/cover", target, 1)
              s = s.replace("url('engineering-bg.svg') center/cover", target, 1)
          else:
              s = s.replace(target, fallback, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Remove temporary upload files
        run: |
          rm -f hero-pipeline-temp.txt hero-pipeline-temp2.txt hero-pipeline-temp3.txt hero-pipeline-temp4.txt hero-pipeline-temp5.txt

      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html hero-pipeline.webp hero-pipeline.b64 hero3.part* hero2.part* hero-pipeline.part* hero-pipeline-temp*.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Apply project reference background'
          git push
